<!DOCTYPE html>
<html lang="zh-HK">
<head>
	<meta charset="utf-8">
	<title>港式打邊爐爭霸 3D (Hong Kong Hotpot Battle 3D)</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<!-- Three.js CDN -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<style>
		:root {
			--neon-red: #ff3333;
			--neon-orange: #ff9900;
			--gold: #ffd700;
			--bg-dark: #09060c;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			user-select: none;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}

		body, html {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: var(--bg-dark);
			display: flex;
			justify-content: center;
			align-items: center;
		}

		#game-container {
			position: relative;
			width: 100%;
			max-width: 1000px;
			height: 100%;
			max-height: 700px;
			background-color: #060408;
			border: 2px solid rgba(255, 153, 0, 0.4);
			border-radius: 12px;
			box-shadow: 0 0 35px rgba(255, 153, 0, 0.2);
			overflow: hidden;
		}

		#game-canvas {
			width: 100%;
			height: 100%;
			display: block;
		}

		/* HUD Panel */
		.hud-panel {
			position: absolute;
			top: 15px;
			left: 15px;
			right: 15px;
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			pointer-events: none;
			z-index: 10;
		}

		.hud-card {
			background: rgba(12, 8, 16, 0.85);
			border: 1px solid rgba(255, 153, 0, 0.4);
			border-radius: 8px;
			padding: 8px 16px;
			color: #fff;
			font-size: 0.9rem;
			pointer-events: auto;
			backdrop-filter: blur(8px);
			box-shadow: 0 4px 15px rgba(0,0,0,0.6);
		}

		.score-label {
			color: var(--gold);
			font-weight: bold;
			font-size: 1.3rem;
			font-family: monospace;
		}

		/* Popup Floating Indicator */
		.popup-notice {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%) scale(0.8);
			font-size: 2rem;
			font-weight: bold;
			color: var(--gold);
			text-shadow: 0 0 15px rgba(255,215,0,0.8);
			pointer-events: none;
			opacity: 0;
			transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			z-index: 30;
		}

		.popup-notice.show {
			opacity: 1;
			transform: translate(-50%, -60%) scale(1.1);
		}

		/* Excel Camouflage */
		#camo-overlay {
			position: absolute;
			top: 0; left: 0; width: 100%; height: 100%;
			background: #ffffff;
			z-index: 999;
			display: none;
			flex-direction: column;
			color: #000;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}

		.excel-titlebar {
			background: #107c41;
			color: #fff;
			padding: 6px 12px;
			font-size: 0.85rem;
			display: flex;
			justify-content: space-between;
		}

		.excel-toolbar {
			background: #f3f2f1;
			border-bottom: 1px solid #e1dfdd;
			padding: 8px 12px;
			display: flex; gap: 15px; font-size: 0.85rem;
		}

		.excel-grid-container {
			flex: 1; overflow: auto; padding: 10px;
		}

		.excel-table {
			border-collapse: collapse; width: 100%; font-size: 0.85rem;
		}

		.excel-table th, .excel-table td {
			border: 1px solid #d2d0ce; padding: 6px 12px; text-align: left;
		}

		.excel-table th { background: #f3f2f1; }
	</style>
</head>
<body>

	<div id="game-container">
		<canvas id="game-canvas"></canvas>

		<!-- HUD Header -->
		<div class="hud-panel">
			<div class="hud-card">
				<div>得分 (Score): <span class="score-label" id="score-val">0</span> 🍲</div>
				<div style="font-size: 0.75rem; color: #aaa; margin-top: 2px;">按空白鍵 (Space) 可開啟扮工掩護</div>
			</div>
			<div class="hud-card">
				<div>連擊 Combo: <span class="score-label" id="combo-val" style="color: var(--neon-orange);">0x</span></div>
				<div style="font-size: 0.75rem; color: #aaa; margin-top: 2px;">點擊湯鍋中「剛熟金黃」的食材！</div>
			</div>
		</div>

		<!-- Popup Floating Notice -->
		<div class="popup-notice" id="popup-notice">完美搶食！+500</div>

		<!-- Excel Camouflage -->
		<div id="camo-overlay">
			<div class="excel-titlebar">
				<span>Microsoft Excel - Hotpot_Calorie_Audit_2026.xlsx</span>
				<span>[扮工中 - 按空白鍵返回遊戲]</span>
			</div>
			<div class="excel-toolbar">
				<span style="font-weight: bold; border-bottom: 2px solid #107c41; padding-bottom: 2px;">檔案</span>
				<span>常用</span> <span>食材卡路里</span> <span>搶食統計</span>
			</div>
			<div class="excel-grid-container">
				<table class="excel-table">
					<thead>
						<tr>
							<th></th> <th>A (食材名稱)</th> <th>B (最佳熟度時間)</th> <th>C (單份熱量)</th> <th>D (搶食得分)</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td style="background: #f3f2f1; font-weight: bold; text-align: center;">1</td>
							<td>極品和牛片</td> <td>8 秒 (七成熟)</td> <td>180 kcal</td>
							<td id="excel-score-val" style="font-weight: bold; color: #107c41;">0</td>
						</tr>
						<tr>
							<td style="background: #f3f2f1; font-weight: bold; text-align: center;">2</td>
							<td>彈牙手打墨魚丸</td> <td>15 秒 (全熟)</td> <td>120 kcal</td> <td></td>
						</tr>
						<tr>
							<td style="background: #f3f2f1; font-weight: bold; text-align: center;">3</td>
							<td>響鈴炸響鈴捲</td> <td>3 秒 (黃金三秒)</td> <td>220 kcal</td> <td></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script>
		// --- Web Audio Synthesizer ---
		const AudioContext = window.AudioContext || window.webkitAudioContext;
		let audioCtx = null;

		function initAudio() {
			if (!audioCtx) audioCtx = new AudioContext();
			if (audioCtx.state === 'suspended') audioCtx.resume();
		}

		function playSound(type) {
			try {
				initAudio();
				if (!audioCtx) return;
				const now = audioCtx.currentTime;

				if (type === 'grab') {
					const osc = audioCtx.createOscillator();
					osc.type = 'sine';
					osc.frequency.setValueAtTime(600, now);
					osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
					const gain = audioCtx.createGain();
					gain.gain.setValueAtTime(0.25, now);
					gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
					osc.connect(gain); gain.connect(audioCtx.destination);
					osc.start(now); osc.stop(now + 0.1);
				} else if (type === 'miss') {
					const osc = audioCtx.createOscillator();
					osc.type = 'sawtooth';
					osc.frequency.setValueAtTime(160, now);
					osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
					const gain = audioCtx.createGain();
					gain.gain.setValueAtTime(0.2, now);
					gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
					osc.connect(gain); gain.connect(audioCtx.destination);
					osc.start(now); osc.stop(now + 0.25);
				}
			} catch(e) {}
		}

		// Game State
		const STATE = {
			score: 0,
			combo: 0
		};

		const scoreValEl = document.getElementById('score-val');
		const comboValEl = document.getElementById('combo-val');
		const excelScoreValEl = document.getElementById('excel-score-val');
		const popupNotice = document.getElementById('popup-notice');

		function updateHUD() {
			scoreValEl.innerText = STATE.score;
			excelScoreValEl.innerText = STATE.score;
			comboValEl.innerText = STATE.combo + 'x';
		}

		function showPopup(text, success) {
			popupNotice.innerText = text;
			popupNotice.style.color = success ? 'var(--gold)' : '#ff5555';
			popupNotice.classList.add('show');
			setTimeout(() => popupNotice.classList.remove('show'), 1000);
		}

		// Boss Key (Spacebar)
		let isCamo = false;
		window.addEventListener('keydown', (e) => {
			if (e.code === 'Space') {
				e.preventDefault();
				isCamo = !isCamo;
				document.getElementById('camo-overlay').style.display = isCamo ? 'flex' : 'none';
			}
		});

		// --- Three.js 3D Engine Setup ---
		const container = document.getElementById('game-container');
		const canvas = document.getElementById('game-canvas');

		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x060408);
		scene.fog = new THREE.FogExp2(0x060408, 0.035);

		const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
		camera.position.set(0, 3.5, 3.2);
		camera.lookAt(0, 0, 0);

		const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
		renderer.setSize(container.clientWidth, container.clientHeight);
		renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

		window.addEventListener('resize', () => {
			const w = container.clientWidth;
			const h = container.clientHeight;
			camera.aspect = w / h;
			camera.updateProjectionMatrix();
			renderer.setSize(w, h);
		});

		// Lighting
		const ambient = new THREE.AmbientLight(0xffffff, 0.6);
		scene.add(ambient);

		const warmLight = new THREE.PointLight(0xffaa44, 2.5, 12);
		warmLight.position.set(0, 4, 0);
		scene.add(warmLight);

		// --- Wooden Dining Table ---
		const tableGeo = new THREE.BoxGeometry(5, 0.2, 5);
		const tableMat = new THREE.MeshStandardMaterial({ color: 0x3a2012, roughness: 0.7 });
		const tableMesh = new THREE.Mesh(tableGeo, tableMat);
		tableMesh.position.y = -0.1;
		scene.add(tableMesh);

		// --- 3D Split Hotpot (鴛鴦鍋) ---
		const potOuterGeo = new THREE.CylinderGeometry(1.6, 1.4, 0.6, 32);
		const potMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.8, roughness: 0.2 });
		const potOuter = new THREE.Mesh(potOuterGeo, potMat);
		potOuter.position.y = 0.3;
		scene.add(potOuter);

		// Spicy Soup (Red)
		const soupRedGeo = new THREE.CircleGeometry(1.5, 32, 0, Math.PI);
		const soupRedMat = new THREE.MeshBasicMaterial({ color: 0xd90429, side: THREE.DoubleSide });
		const soupRed = new THREE.Mesh(soupRedGeo, soupRedMat);
		soupRed.rotation.x = Math.PI / 2;
		soupRed.position.set(0, 0.55, 0);
		scene.add(soupRed);

		// Clear Soup (White/Clear)
		const soupClearGeo = new THREE.CircleGeometry(1.5, 32, Math.PI, Math.PI);
		const soupClearMat = new THREE.MeshBasicMaterial({ color: 0xfff3b0, side: THREE.DoubleSide });
		const soupClear = new THREE.Mesh(soupClearGeo, soupClearMat);
		soupClear.rotation.x = Math.PI / 2;
		soupClear.position.set(0, 0.55, 0);
		scene.add(soupClear);

		// Divider
		const divGeo = new THREE.BoxGeometry(3.0, 0.65, 0.08);
		const divider = new THREE.Mesh(divGeo, potMat);
		divider.position.y = 0.35;
		scene.add(divider);

		// --- Food Ingredients Class ---
		const FOOD_TYPES = [
			{ name: '和牛片 🥩', colorRaw: 0xff4d6d, colorPerfect: 0x9e2a2b, colorBurnt: 0x2b1e1e, points: 500, cookTime: 4 },
			{ name: '墨魚丸 🍡', colorRaw: 0xf8f9fa, colorPerfect: 0xffd166, colorBurnt: 0x544747, points: 300, cookTime: 6 },
			{ name: '響鈴捲 🥟', colorRaw: 0xffee8c, colorPerfect: 0xf4a261, colorBurnt: 0x3d2817, points: 400, cookTime: 2.5 }
		];

		const activeFoodList = [];

		function spawnFood() {
			if (activeFoodList.length >= 8) return;

			const type = FOOD_TYPES[Math.floor(Math.random() * FOOD_TYPES.length)];
			const geo = new THREE.DodecahedronGeometry(0.18, 1);
			const mat = new THREE.MeshStandardMaterial({ color: type.colorRaw, roughness: 0.4 });
			const mesh = new THREE.Mesh(geo, mat);

			// Random position inside pot circle
			const angle = Math.random() * Math.PI * 2;
			const radius = 0.3 + Math.random() * 1.0;
			mesh.position.set(Math.cos(angle) * radius, 0.58, Math.sin(angle) * radius);

			scene.add(mesh);

			activeFoodList.push({
				mesh: mesh,
				type: type,
				cookProgress: 0, // 0 (Raw) -> 1 (Perfect) -> 2 (Burnt)
				state: 'RAW' // RAW, PERFECT, BURNT
			});
		}

		// Raycasting to Grab Food
		const raycaster = new THREE.Raycaster();
		const mouse = new THREE.Vector2();

		function onPointerDown(e) {
			const rect = container.getBoundingClientRect();
			mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
			mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;

			raycaster.setFromCamera(mouse, camera);
			const intersects = raycaster.intersectObjects(activeFoodList.map(f => f.mesh));

			if (intersects.length > 0) {
				const hitMesh = intersects[0].object;
				const foodIdx = activeFoodList.findIndex(f => f.mesh === hitMesh);

				if (foodIdx >= 0) {
					const food = activeFoodList[foodIdx];

					if (food.state === 'PERFECT') {
						STATE.combo++;
						const pts = food.type.points * Math.min(5, STATE.combo);
						STATE.score += pts;
						playSound('grab');
						showPopup(`搶到 ${food.type.name}！+${pts}`, true);
					} else if (food.state === 'RAW') {
						STATE.combo = 0;
						playSound('miss');
						showPopup('尚未熟透！(Raw)', false);
					} else { // BURNT
						STATE.combo = 0;
						playSound('miss');
						showPopup('煮糊了！(Burnt)', false);
					}

					scene.remove(food.mesh);
					activeFoodList.splice(foodIdx, 1);
					updateHUD();
				}
			}
		}

		container.addEventListener('mousedown', onPointerDown);

		// --- Main Game Animation Loop ---
		const clock = new THREE.Clock();

		function animate() {
			requestAnimationFrame(animate);
			const delta = Math.min(clock.getDelta(), 0.1);

			// Spawn items
			if (Math.random() < 0.03) spawnFood();

			// Update Food Cooking Status & Color Tint
			for (let i = activeFoodList.length - 1; i >= 0; i--) {
				const f = activeFoodList[i];
				f.cookProgress += (delta / f.type.cookTime);

				// Bobbing in boiling soup
				f.mesh.position.y = 0.58 + Math.sin(clock.getElapsedTime() * 6 + i) * 0.03;
				f.mesh.rotation.y += 0.5 * delta;

				if (f.cookProgress < 0.7) {
					f.state = 'RAW';
					f.mesh.material.color.setHex(f.type.colorRaw);
				} else if (f.cookProgress >= 0.7 && f.cookProgress <= 1.4) {
					f.state = 'PERFECT';
					f.mesh.material.color.setHex(f.type.colorPerfect);
				} else if (f.cookProgress > 1.4 && f.cookProgress <= 2.2) {
					f.state = 'BURNT';
					f.mesh.material.color.setHex(f.type.colorBurnt);
				} else {
					// Disappear burnt food
					scene.remove(f.mesh);
					activeFoodList.splice(i, 1);
				}
			}

			renderer.render(scene, camera);
		}

		animate();
		updateHUD();

	</script>
</body>
</html>

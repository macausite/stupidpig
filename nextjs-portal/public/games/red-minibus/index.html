<!DOCTYPE html>
<html lang="zh-HK">
<head>
	<meta charset="utf-8">
	<title>亡命紅Van大挑戰 3D (Death-Defying Red Minibus 3D)</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<!-- Three.js CDN -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<style>
		:root {
			--neon-red: #ff3333;
			--neon-yellow: #ffdd00;
			--neon-blue: #00e5ff;
			--bg-dark: #08060c;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			user-select: none;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}

		body, html {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: var(--bg-dark);
			display: flex;
			justify-content: center;
			align-items: center;
		}

		#game-container {
			position: relative;
			width: 100%;
			max-width: 1000px;
			height: 100%;
			max-height: 700px;
			background-color: #050308;
			border: 2px solid rgba(255, 51, 51, 0.4);
			border-radius: 12px;
			box-shadow: 0 0 35px rgba(255, 51, 51, 0.25);
			overflow: hidden;
		}

		#game-canvas {
			width: 100%;
			height: 100%;
			display: block;
		}

		/* HUD Panel */
		.hud-panel {
			position: absolute;
			top: 15px;
			left: 15px;
			right: 15px;
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			pointer-events: none;
			z-index: 10;
		}

		.hud-card {
			background: rgba(9, 8, 16, 0.85);
			border: 1px solid rgba(255, 51, 51, 0.4);
			border-radius: 8px;
			padding: 8px 16px;
			color: #fff;
			font-size: 0.9rem;
			pointer-events: auto;
			backdrop-filter: blur(8px);
			box-shadow: 0 4px 15px rgba(0,0,0,0.6);
		}

		.speedometer {
			font-size: 1.8rem;
			font-weight: 800;
			color: var(--neon-yellow);
			font-family: monospace;
			text-shadow: 0 0 10px var(--neon-yellow);
		}

		/* Touch Steering Controls */
		.touch-controls {
			position: absolute;
			bottom: 25px;
			left: 20px;
			right: 20px;
			display: flex;
			justify-content: space-between;
			z-index: 20;
			pointer-events: none;
		}

		.ctrl-btn {
			width: 70px;
			height: 70px;
			border-radius: 50%;
			background: rgba(255, 51, 51, 0.25);
			border: 2px solid var(--neon-red);
			color: #fff;
			font-size: 1.8rem;
			display: flex;
			justify-content: center;
			align-items: center;
			pointer-events: auto;
			cursor: pointer;
			box-shadow: 0 0 15px rgba(255,51,51,0.4);
			backdrop-filter: blur(5px);
		}

		.ctrl-btn:active {
			background: rgba(255, 51, 51, 0.6);
			transform: scale(0.95);
		}

		.stop-btn {
			width: auto;
			padding: 0 24px;
			border-radius: 35px;
			background: linear-gradient(180deg, #ffdd00 0%, #b39b00 100%);
			color: #000;
			font-weight: bold;
			font-size: 1.1rem;
			border: 2px solid #fff;
		}

		/* Start Overlay */
		.start-overlay {
			position: absolute;
			top: 0; left: 0; width: 100%; height: 100%;
			background: rgba(5, 3, 8, 0.88);
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			z-index: 100;
			color: #fff;
			text-align: center;
			padding: 20px;
		}

		.start-title {
			font-size: 2.5rem;
			font-weight: bold;
			color: var(--neon-red);
			text-shadow: 0 0 20px var(--neon-red);
			margin-bottom: 10px;
		}

		.start-btn {
			margin-top: 25px;
			background: linear-gradient(180deg, #ff3333 0%, #b30000 100%);
			color: #fff;
			border: none;
			padding: 14px 40px;
			font-size: 1.2rem;
			font-weight: bold;
			border-radius: 30px;
			cursor: pointer;
			box-shadow: 0 0 20px rgba(255,51,51,0.5);
			transition: all 0.2s;
		}

		.start-btn:hover {
			transform: scale(1.06);
		}

		/* Excel Camouflage */
		#camo-overlay {
			position: absolute;
			top: 0; left: 0; width: 100%; height: 100%;
			background: #ffffff;
			z-index: 999;
			display: none;
			flex-direction: column;
			color: #000;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}

		.excel-titlebar {
			background: #107c41;
			color: #fff;
			padding: 6px 12px;
			font-size: 0.85rem;
			display: flex;
			justify-content: space-between;
		}

		.excel-toolbar {
			background: #f3f2f1;
			border-bottom: 1px solid #e1dfdd;
			padding: 8px 12px;
			display: flex; gap: 15px; font-size: 0.85rem;
		}

		.excel-grid-container {
			flex: 1; overflow: auto; padding: 10px;
		}

		.excel-table {
			border-collapse: collapse; width: 100%; font-size: 0.85rem;
		}

		.excel-table th, .excel-table td {
			border: 1px solid #d2d0ce; padding: 6px 12px; text-align: left;
		}

		.excel-table th { background: #f3f2f1; }
	</style>
</head>
<body>

	<div id="game-container">
		<canvas id="game-canvas"></canvas>

		<!-- HUD Header -->
		<div class="hud-panel">
			<div class="hud-card">
				<div>車速 (Speed): <span class="speedometer" id="speed-val">0</span> km/h</div>
				<div style="font-size: 0.75rem; color: #aaa; margin-top: 2px;">按 [A/D] 或 [←/→] 閃避障礙</div>
			</div>
			<div class="hud-card">
				<div>車資收益: <span style="color: var(--neon-yellow); font-weight: bold; font-size: 1.3rem;" id="fare-val">$0</span></div>
				<div style="font-size: 0.75rem; color: #aaa; margin-top: 2px;">落客提示: <span id="stop-notice" style="color: #ff3333; font-weight: bold;">--</span></div>
			</div>
		</div>

		<!-- Touch Controls -->
		<div class="touch-controls">
			<div style="display: flex; gap: 15px;">
				<div class="ctrl-btn" id="btn-left">◀</div>
				<div class="ctrl-btn" id="btn-right">▶</div>
			</div>
			<div class="ctrl-btn stop-btn" id="btn-stop">📢 有落！(DROP OFF)</div>
		</div>

		<!-- Start Overlay -->
		<div class="start-overlay" id="start-modal">
			<div class="start-title">亡 命 紅 V a n 大 挑 戰 3D</div>
			<div style="max-width: 500px; line-height: 1.6; color: #ccc;">
				深夜極速行駛屯門公路！閃避的士與雙層巴士，收集車資金幣，並在乘客叫喊「有落」時即時剎車！
			</div>
			<button class="start-btn" onclick="startGame()">🚀 亡命開車！</button>
		</div>

		<!-- Excel Camouflage -->
		<div id="camo-overlay">
			<div class="excel-titlebar">
				<span>Microsoft Excel - RedMinibus_Route_Schedule_2026.xlsx</span>
				<span>[扮工中 - 按空白鍵返回遊戲]</span>
			</div>
			<div class="excel-toolbar">
				<span style="font-weight: bold; border-bottom: 2px solid #107c41; padding-bottom: 2px;">檔案</span>
				<span>常用</span> <span>路線時效</span> <span>車資精算</span>
			</div>
			<div class="excel-grid-container">
				<table class="excel-table">
					<thead>
						<tr>
							<th></th> <th>A (路線路段)</th> <th>B (平均時速)</th> <th>C (乘客人數)</th> <th>D (總收益)</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td style="background: #f3f2f1; font-weight: bold; text-align: center;">1</td>
							<td>旺角至元朗夜班線</td> <td>138 km/h</td> <td>16 人</td>
							<td id="excel-fare-val" style="font-weight: bold; color: #107c41;">$0</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script>
		// --- Web Audio Synthesizer ---
		const AudioContext = window.AudioContext || window.webkitAudioContext;
		let audioCtx = null;

		function initAudio() {
			if (!audioCtx) audioCtx = new AudioContext();
			if (audioCtx.state === 'suspended') audioCtx.resume();
		}

		function playSound(type) {
			try {
				initAudio();
				if (!audioCtx) return;
				const now = audioCtx.currentTime;

				if (type === 'engine') {
					const osc = audioCtx.createOscillator();
					osc.type = 'sawtooth';
					osc.frequency.setValueAtTime(80, now);
					osc.frequency.exponentialRampToValueAtTime(140, now + 0.2);
					const gain = audioCtx.createGain();
					gain.gain.setValueAtTime(0.15, now);
					gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
					osc.connect(gain); gain.connect(audioCtx.destination);
					osc.start(now); osc.stop(now + 0.2);
				} else if (type === 'coin') {
					const osc = audioCtx.createOscillator();
					osc.type = 'sine';
					osc.frequency.setValueAtTime(987.77, now); // B5
					osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
					const gain = audioCtx.createGain();
					gain.gain.setValueAtTime(0.2, now);
					gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
					osc.connect(gain); gain.connect(audioCtx.destination);
					osc.start(now); osc.stop(now + 0.25);
				} else if (type === 'crash') {
					const osc = audioCtx.createOscillator();
					osc.type = 'square';
					osc.frequency.setValueAtTime(120, now);
					osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
					const gain = audioCtx.createGain();
					gain.gain.setValueAtTime(0.3, now);
					gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
					osc.connect(gain); gain.connect(audioCtx.destination);
					osc.start(now); osc.stop(now + 0.4);
				}
			} catch(e) {}
		}

		// Game State
		const STATE = {
			playing: false,
			speed: 110, // km/h
			fare: 0,
			minibusX: 0, // -1.8 to 1.8
			stopRequired: false,
			stopTimer: 0
		};

		const speedValEl = document.getElementById('speed-val');
		const fareValEl = document.getElementById('fare-val');
		const excelFareValEl = document.getElementById('excel-fare-val');
		const stopNoticeEl = document.getElementById('stop-notice');
		const startModal = document.getElementById('start-modal');

		function updateHUD() {
			speedValEl.innerText = Math.floor(STATE.speed);
			fareValEl.innerText = '$' + STATE.fare;
			excelFareValEl.innerText = '$' + STATE.fare;
			stopNoticeEl.innerText = STATE.stopRequired ? '⚠️ 有落！按 [有落] 剎車！' : '--';
		}

		// Boss Key (Spacebar)
		let isCamo = false;
		window.addEventListener('keydown', (e) => {
			if (e.code === 'Space' && isCamo) {
				e.preventDefault();
				isCamo = false;
				document.getElementById('camo-overlay').style.display = 'none';
			} else if (e.code === 'KeyB') {
				isCamo = true;
				document.getElementById('camo-overlay').style.display = 'flex';
			}
		});

		// --- Three.js 3D Engine Setup ---
		const container = document.getElementById('game-container');
		const canvas = document.getElementById('game-canvas');

		const scene = new THREE.Scene();
		scene.background = new THREE.Color(0x050308);
		scene.fog = new THREE.FogExp2(0x050308, 0.025);

		const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
		camera.position.set(0, 2.2, 5.5);
		camera.lookAt(0, 1.0, -10);

		const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
		renderer.setSize(container.clientWidth, container.clientHeight);
		renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

		window.addEventListener('resize', () => {
			const w = container.clientWidth;
			const h = container.clientHeight;
			camera.aspect = w / h;
			camera.updateProjectionMatrix();
			renderer.setSize(w, h);
		});

		// Lighting
		const ambient = new THREE.AmbientLight(0xffffff, 0.5);
		scene.add(ambient);

		const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
		dirLight.position.set(0, 10, 5);
		scene.add(dirLight);

		// --- Highway Road Mesh ---
		const roadGeo = new THREE.PlaneGeometry(8, 120);
		const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1824, roughness: 0.8 });
		const roadMesh = new THREE.Mesh(roadGeo, roadMat);
		roadMesh.rotation.x = -Math.PI / 2;
		roadMesh.position.z = -50;
		scene.add(roadMesh);

		// Highway Lane Lines
		const linesGroup = new THREE.Group();
		for (let i = -100; i < 20; i += 6) {
			const l1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, 3), new THREE.MeshBasicMaterial({ color: 0xffffff }));
			l1.position.set(-1.3, 0.02, i);
			const l2 = l1.clone();
			l2.position.set(1.3, 0.02, i);
			linesGroup.add(l1);
			linesGroup.add(l2);
		}
		scene.add(linesGroup);

		// --- 3D Red Minibus Player Model ---
		const minibusGroup = new THREE.Group();

		// Red Lower Body
		const bodyGeo = new THREE.BoxGeometry(1.2, 0.7, 2.2);
		const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd90429, roughness: 0.3 });
		const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
		bodyMesh.position.y = 0.55;
		minibusGroup.add(bodyMesh);

		// White Roof
		const roofGeo = new THREE.BoxGeometry(1.18, 0.5, 2.18);
		const roofMat = new THREE.MeshStandardMaterial({ color: 0xf8f9fa, roughness: 0.3 });
		const roofMesh = new THREE.Mesh(roofGeo, roofMat);
		roofMesh.position.y = 1.1;
		minibusGroup.add(roofMesh);

		// Headlights
		const headLightL = new THREE.SpotLight(0xfffaed, 3, 25, 0.4);
		headLightL.position.set(-0.4, 0.6, -1.1);
		headLightL.target.position.set(-0.4, 0, -10);
		minibusGroup.add(headLightL);
		minibusGroup.add(headLightL.target);

		const headLightR = headLightL.clone();
		headLightR.position.x = 0.4;
		headLightR.target.position.x = 0.4;
		minibusGroup.add(headLightR);
		minibusGroup.add(headLightR.target);

		minibusGroup.position.set(0, 0, 0);
		scene.add(minibusGroup);

		// --- Traffic & Collectibles ---
		const trafficVehicles = [];
		const coinsList = [];

		function spawnTraffic() {
			if (trafficVehicles.length > 5) return;
			const isTaxi = Math.random() > 0.4;
			const vGeo = isTaxi ? new THREE.BoxGeometry(1.1, 0.6, 2.0) : new THREE.BoxGeometry(1.4, 1.4, 3.2);
			const vMat = new THREE.MeshStandardMaterial({ color: isTaxi ? 0xd90429 : 0x0077b6 });
			const mesh = new THREE.Mesh(vGeo, vMat);

			const lanes = [-2.2, 0, 2.2];
			mesh.position.set(lanes[Math.floor(Math.random() * lanes.length)], isTaxi ? 0.4 : 0.8, -70 - Math.random() * 30);
			scene.add(mesh);
			trafficVehicles.push(mesh);
		}

		function spawnCoin() {
			if (coinsList.length > 6) return;
			const cGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.05, 16);
			const cMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
			const coin = new THREE.Mesh(cGeo, cMat);
			coin.rotation.x = Math.PI / 2;
			const lanes = [-2.2, 0, 2.2];
			coin.position.set(lanes[Math.floor(Math.random() * lanes.length)], 0.5, -60 - Math.random() * 40);
			scene.add(coin);
			coinsList.push(coin);
		}

		// Input Handling
		let moveLeft = false, moveRight = false;

		window.addEventListener('keydown', (e) => {
			if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
			if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
		});

		window.addEventListener('keyup', (e) => {
			if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
			if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
		});

		document.getElementById('btn-left').addEventListener('touchstart', () => moveLeft = true);
		document.getElementById('btn-left').addEventListener('touchend', () => moveLeft = false);
		document.getElementById('btn-right').addEventListener('touchstart', () => moveRight = true);
		document.getElementById('btn-right').addEventListener('touchend', () => moveRight = false);

		document.getElementById('btn-stop').addEventListener('click', handleDropOff);

		function handleDropOff() {
			if (STATE.stopRequired) {
				STATE.stopRequired = false;
				STATE.fare += 150;
				playSound('coin');
				updateHUD();
			}
		}

		window.startGame = function() {
			STATE.playing = true;
			STATE.speed = 110;
			STATE.fare = 0;
			startModal.style.display = 'none';
			updateHUD();
		};

		// --- Main Animation Loop ---
		const clock = new THREE.Clock();

		function animate() {
			requestAnimationFrame(animate);
			const delta = Math.min(clock.getDelta(), 0.1);

			if (STATE.playing) {
				// Minibus Steering
				if (moveLeft && STATE.minibusX > -2.2) STATE.minibusX -= 4.5 * delta;
				if (moveRight && STATE.minibusX < 2.2) STATE.minibusX += 4.5 * delta;

				minibusGroup.position.x = STATE.minibusX;
				minibusGroup.rotation.z = -(moveRight ? 1 : moveLeft ? -1 : 0) * 0.08;

				// Move Road Lines
				const moveDist = (STATE.speed * 0.3) * delta;
				linesGroup.children.forEach(line => {
					line.position.z += moveDist;
					if (line.position.z > 10) line.position.z -= 100;
				});

				// Spawn elements
				if (Math.random() < 0.03) spawnTraffic();
				if (Math.random() < 0.04) spawnCoin();

				// Move Traffic
				for (let i = trafficVehicles.length - 1; i >= 0; i--) {
					const v = trafficVehicles[i];
					v.position.z += moveDist * 0.4;

					// Collision Check with player
					if (Math.abs(v.position.z - minibusGroup.position.z) < 1.8 &&
						Math.abs(v.position.x - minibusGroup.position.x) < 1.0) {
						playSound('crash');
						STATE.speed = Math.max(50, STATE.speed - 30);
						v.position.z = 20; // remove
					}

					if (v.position.z > 10) {
						scene.remove(v);
						trafficVehicles.splice(i, 1);
					}
				}

				// Move Coins
				for (let i = coinsList.length - 1; i >= 0; i--) {
					const c = coinsList[i];
					c.position.z += moveDist;
					c.rotation.z += 3 * delta;

					// Collection check
					if (Math.abs(c.position.z - minibusGroup.position.z) < 1.5 &&
						Math.abs(c.position.x - minibusGroup.position.x) < 0.9) {
						playSound('coin');
						STATE.fare += 20;
						scene.remove(c);
						coinsList.splice(i, 1);
						updateHUD();
					} else if (c.position.z > 10) {
						scene.remove(c);
						coinsList.splice(i, 1);
					}
				}

				// Random Stop Announcements
				if (!STATE.stopRequired && Math.random() < 0.003) {
					STATE.stopRequired = true;
					playSound('engine');
					updateHUD();
				}

				// Auto speed recovery
				if (STATE.speed < 120) STATE.speed += 5 * delta;
			}

			renderer.render(scene, camera);
		}

		animate();
		updateHUD();

	</script>
</body>
</html>
